name: Build FarmGame APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."      # لأن ملفاتك بالجذر
          app-name: "FarmGame"
          output-folder-path: "apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farmgame-apk
          path: apk-output/
